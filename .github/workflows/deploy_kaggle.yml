name: Deploy and Run Qwen TPU on Kaggle

on:
  workflow_dispatch: # Keeps the manual button active
  schedule:
    # Runs ONLY tomorrow (Oct 21, 2026) at 3:00 AM UTC (5:00 AM Brussels time)
    - cron: '0 3 21 10 *'

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Inject GitHub PAT into Notebook safely
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Replaces the placeholder string inside your notebook with your secure GitHub token
          sed -i "s|REPLACE_ME_GH_PAT|$GH_PAT|g" QWEN/qwen_tpu_notebook.ipynb

      - name: Push and Trigger Kaggle Notebook
        run: |
          kaggle kernels push -p QWEN
