name: Deploy and Run Qwen TPU on Kaggle

on:
  workflow_dispatch: # Allows both cron-job.org HTTP triggers and manual UI button clicks
jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle Credentials Safely
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python3 -c "
          import json, os
          # Automatically strip any accidental quotes or whitespace from secrets
          user = os.environ.get('KAGGLE_USERNAME', '').strip('\"\' \n\r')
          key = os.environ.get('KAGGLE_KEY', '').strip('\"\' \n\r')
          
          if not user or not key:
              raise ValueError('KAGGLE_USERNAME or KAGGLE_KEY secret is missing or empty!')
              
          config_dir = os.path.expanduser('~/.kaggle')
          os.makedirs(config_dir, exist_ok=True)
          
          config_path = os.path.join(config_dir, 'kaggle.json')
          with open(config_path, 'w') as f:
              json.dump({'username': user, 'key': key}, f)
              
          os.chmod(config_path, 0o600)
          print('✅ Clean kaggle.json created for user:', user)
          "

      - name: Inject GitHub PAT into Notebook safely
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Replaces the placeholder string inside your notebook with your secure GitHub token
          sed -i "s|REPLACE_ME_GH_PAT|$GH_PAT|g" QWEN/qwen_tpu_notebook.ipynb

      - name: Push and Trigger Kaggle Notebook
        run: |
          kaggle kernels push -p QWEN
