<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen TPU Chat (Temp 0)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold tracking-wide">Qwen 3.8 27B <span class="text-xs bg-blue-600 text-white py-1 px-2 rounded ml-2">TPU v5e-8</span></h1>
            <p id="status-text" class="text-xs text-yellow-400 mt-1">⏳ Connecting to Kaggle Endpoint...</p>
        </div>
        <div class="text-right text-xs text-gray-400">
            <div>Max Context: <span class="text-gray-200">64k</span></div>
            <div>Temperature: <span class="text-gray-200">0 (Deterministic)</span></div>
        </div>
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold">AI</div>
            <div class="bg-gray-800 p-3 rounded-lg shadow max-w-[80%] text-sm leading-relaxed">
                Hello! I am Qwen running on your Kaggle TPU node. Once your Kaggle notebook is running and has updated the endpoint, you can start chatting here.
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your prompt here..." 
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-gray-100"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg text-sm transition disabled:opacity-50"
            >
                Send
            </button>
        </form>
    </footer>

    <script>
        let apiBaseUrl = "";
        let conversationHistory = [
            { role: "system", content: "You are a helpful, respectful, and honest assistant." }
        ];

        async function fetchEndpoint() {
            try {
                const res = await fetch('./QWEN_ENDPOINT.json?t=' + Date.now());
                const data = await res.json();
                if (data.status === "online" && data.api_base_url) {
                    apiBaseUrl = data.api_base_url;
                    document.getElementById("status-text.textContent").textContent = "";
                    document.getElementById("status-text").innerHTML = `<span class="text-green-400">🟢 Online (Connected to TPU)</span>`;
                } else {
                    document.getElementById("status-text").innerHTML = `<span class="text-red-400">🔴 Offline (Waiting for Kaggle Notebook to start)</span>`;
                }
            } catch (err) {
                document.getElementById("status-text").innerHTML = `<span class="text-red-400">🔴 Error fetching endpoint configuration</span>`;
            }
        }

        // Check endpoint status on load and every 10 seconds
        fetchEndpoint();
        setInterval(fetchEndpoint, 10000);

        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const chatContainer = document.getElementById("chat-container");

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || !apiBaseUrl) {
                if (!apiBaseUrl) alert("Model is currently offline. Please start your Kaggle notebook first.");
                return;
            }

            userInput.value = "";
            appendMessage("user", text);
            conversationHistory.push({ role: "user", content: text });

            // Add loading placeholder
            const loadingId = appendMessage("assistant", "Thinking...");

            try {
                const response = await fetch(`${apiBaseUrl}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "Qwen/Qwen3.8-27B",
                        messages: conversationHistory,
                        temperature: 0,        // Strict deterministic output
                        max_tokens: 4096,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error(`Server responded with status ${response.status}`);

                const data = await response.json();
                const reply = data.choices[0].message.content;

                updateMessage(loadingId, reply);
                conversationHistory.push({ role: "assistant", content: reply });

            } catch (err) {
                updateMessage(loadingId, `⚠️ Error communicating with TPU backend: ${err.message}`);
            }
        });

        function appendMessage(role, text) {
            const id = 'msg-' + Date.now();
            const isUser = role === 'user';
            const html = `
                <div id="${id}" class="flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="${isUser ? 'bg-purple-600' : 'bg-blue-600'} text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shrink-0">
                        ${isUser ? 'YOU' : 'AI'}
                    </div>
                    <div class="bg-gray-800 p-3 rounded-lg shadow max-w-[80%] text-sm leading-relaxed overflow-x-auto">
                        ${isUser ? escapeHtml(text) : marked.parse(text)}
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function updateMessage(id, text) {
            const el = document.getElementById(id);
            if (el) {
                const contentDiv = el.querySelector('div:nth-child(2)');
                contentDiv.innerHTML = marked.parse(text);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
