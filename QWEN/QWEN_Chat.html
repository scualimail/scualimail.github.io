<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen TPU Chat UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-[#0f172a] text-[#f8fafc] h-screen flex overflow-hidden font-sans">

    <!-- Sidebar for Chat History -->
    <aside class="w-72 bg-[#1e293b] border-r border-slate-700 flex flex-col h-full flex-shrink-0">
        <!-- Sidebar Header / New Chat Button -->
        <div class="p-4 border-b border-slate-700 flex items-center justify-between">
            <h1 class="font-bold text-lg tracking-wide text-slate-100">Chat History</h1>
            <button onclick="createNewChat()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition shadow flex items-center space-x-1">
                <span>+ New Chat</span>
            </button>
        </div>

        <!-- Chat History List -->
        <div id="sidebar-chats" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- Dynamically populated threads -->
        </div>

        <!-- Sidebar Footer / Status -->
        <div class="p-4 border-t border-slate-700 text-xs text-slate-400 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse" id="sidebar-status-dot"></span>
                <span id="sidebar-status-text">Connecting...</span>
            </div>
            <span>TPU v5e-8</span>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-full min-w-0">
        <!-- Top Header -->
        <header class="bg-[#1e293b] border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-md flex-shrink-0">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold tracking-wide">Qwen Vision Chat</span>
                <span class="bg-blue-600 text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider">vLLM TPU</span>
            </div>
            <div class="hidden sm:flex items-center space-x-4 text-xs text-slate-400">
                <span>Context: <strong class="text-slate-200">65,536</strong></span>
                <span>Temp: <strong class="text-slate-200">0.0</strong></span>
            </div>
        </header>

        <!-- Chat Messages Window -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="flex items-start space-x-4 max-w-4xl mx-auto w-full">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white flex-shrink-0">AI</div>
                <div class="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 max-w-2xl shadow-sm text-slate-100">
                    <p>Hello! I am Qwen running on your Kaggle TPU node with persistent chat history, vision support, and temperature = 0.0. Start chatting below!</p>
                </div>
            </div>
        </main>

        <!-- Image Attachment Preview Box -->
        <div id="preview-container" class="max-w-4xl w-full mx-auto px-6 hidden flex-shrink-0">
            <div class="relative inline-block mb-2">
                <img id="image-preview" class="h-20 w-20 object-cover rounded-lg border border-slate-600 shadow" src="" alt="Preview">
                <button id="remove-img-btn" type="button" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow hover:bg-red-700 transition">&times;</button>
            </div>
        </div>

        <!-- User Input Controls Footer -->
        <footer class="bg-[#1e293b] border-t border-slate-700 p-4 shadow-lg flex-shrink-0">
            <div class="max-w-4xl mx-auto flex items-end space-x-3">
                <!-- File Upload Button -->
                <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 p-3 rounded-xl transition flex items-center justify-center shadow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>

                <!-- Text Input Area -->
                <textarea id="user-input" rows="1" placeholder="Type your prompt here... (Press Enter to send, Shift+Enter for new line)" class="flex-1 bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none max-h-32"></textarea>

                <!-- Send Button -->
                <button id="send-btn" type="button" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition flex items-center justify-center shadow">
                    Send
                </button>
            </div>
        </footer>
    </div>

    <!-- Frontend Script Logic -->
    <script>
        let apiEndpoint = "";
        let targetModelName = "Qwen/Qwen2.5-VL-7B-Instruct";
        let chats = [];
        let currentChatId = null;
        let attachedImageBase64 = null;

        // Initialize Local Storage Chats
        function initChats() {
            const saved = localStorage.getItem("qwen_chats");
            if (saved) {
                try {
                    chats = JSON.parse(saved);
                } catch(e) {
                    chats = [];
                }
            }
            if (chats.length === 0) {
                createNewChat(false);
            } else {
                currentChatId = chats[0].id;
            }
            renderSidebar();
            renderActiveChat();
        }

        function saveChats() {
            localStorage.setItem("qwen_chats", JSON.stringify(chats));
        }

        function createNewChat(switchNow = true) {
            const newChat = {
                id: "chat_" + Date.now(),
                title: "New Chat",
                messages: []
            };
            chats.unshift(newChat);
            saveChats();
            if (switchNow) {
                currentChatId = newChat.id;
                renderSidebar();
                renderActiveChat();
            }
        }

        function switchChat(id) {
            currentChatId = id;
            renderSidebar();
            renderActiveChat();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) {
                createNewChat(false);
            }
            if (currentChatId === id) {
                currentChatId = chats[0].id;
            }
            saveChats();
            renderSidebar();
            renderActiveChat();
        }

        function renderSidebar() {
            const container = document.getElementById("sidebar-chats");
            container.innerHTML = "";
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const div = document.createElement("div");
                div.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition text-sm ${isActive ? "bg-blue-600 text-white font-medium shadow" : "hover:bg-slate-700 text-slate-300"}`;
                
                const titleSpan = document.createElement("span");
                titleSpan.className = "truncate flex-1 mr-2";
                titleSpan.innerText = chat.title;
                div.appendChild(titleSpan);

                const delBtn = document.createElement("button");
                delBtn.className = `text-xs px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition ${isActive ? "hover:bg-blue-700 text-white" : "hover:bg-slate-600 text-slate-400"}`;
                delBtn.innerHTML = "&times;";
                delBtn.onclick = (e) => deleteChat(chat.id, e);
                div.appendChild(delBtn);

                div.onclick = () => switchChat(chat.id);
                container.appendChild(div);
            });
        }

        function getActiveChat() {
            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                chat = chats[0];
                currentChatId = chat.id;
            }
            return chat;
        }

        function renderActiveChat() {
            const chatContainer = document.getElementById("chat-container");
            chatContainer.innerHTML = "";

            const chat = getActiveChat();

            if (chat.messages.length === 0) {
                const welcomeDiv = document.createElement("div");
                welcomeDiv.className = "flex items-start space-x-4 max-w-4xl mx-auto w-full";
                welcomeDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white flex-shrink-0">AI</div>
                    <div class="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 max-w-2xl shadow-sm text-slate-100">
                        <p>Hello! I am Qwen running on your Kaggle TPU node with chat history, vision support, and temperature = 0.0. Start chatting below!</p>
                    </div>
                `;
                chatContainer.appendChild(welcomeDiv);
                return;
            }

            chat.messages.forEach(msg => {
                appendMessageNode(msg.role, msg.content, msg.imageUrl);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessageNode(role, content, imageUrl = null) {
            const chatContainer = document.getElementById("chat-container");
            const isUser = role === "user";
            
            const messageDiv = document.createElement("div");
            messageDiv.className = `flex items-start space-x-4 max-w-4xl mx-auto w-full ${isUser ? "flex-row-reverse space-x-reverse" : ""}`;

            const avatar = document.createElement("div");
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 ${isUser ? "bg-emerald-600" : "bg-blue-600"}`;
            avatar.innerText = isUser ? "U" : "AI";

            const bubble = document.createElement("div");
            bubble.className = `p-4 rounded-2xl border max-w-2xl shadow-sm ${isUser ? "bg-blue-600 border-blue-500 text-white" : "bg-[#1e293b] border-slate-700 text-slate-100"}`;

            if (imageUrl) {
                const img = document.createElement("img");
                img.src = imageUrl;
                img.className = "max-h-48 rounded-lg mb-3 object-contain border border-slate-600";
                bubble.appendChild(img);
            }

            const textSpan = document.createElement("div");
            if (isUser) {
                textSpan.innerText = content;
            } else {
                textSpan.innerHTML = marked.parse(content);
            }
            bubble.appendChild(textSpan);

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return textSpan;
        }

        // Fetch endpoint URL from QWEN_ENDPOINT.json[cite: 1]
        async function fetchEndpoint() {
            try {
                const res = await fetch('./QWEN_ENDPOINT.json?t=' + Date.now());
                const data = await res.json();
                if (data && data.url) {
                    apiEndpoint = data.url.replace(/\/$/, "");
                    
                    try {
                        const modelRes = await fetch(`${apiEndpoint}/v1/models`);
                        const modelData = await modelRes.json();
                        if (modelData.data && modelData.data[0]) {
                            targetModelName = modelData.data[0].id;
                        }
                    } catch(e) {}

                    document.getElementById("sidebar-status-dot").className = "w-2.5 h-2.5 rounded-full bg-green-500";
                    document.getElementById("sidebar-status-text").innerText = "Connected";
                    document.getElementById("sidebar-status-text").className = "text-green-400 font-medium";
                }
            } catch (err) {
                document.getElementById("sidebar-status-dot").className = "w-2.5 h-2.5 rounded-full bg-red-500";
                document.getElementById("sidebar-status-text").innerText = "Offline";
                setTimeout(fetchEndpoint, 4000);
            }
        }

        // Handle Image Attachment Selection
        document.getElementById("image-input").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedImageBase64 = e.target.result;
                    document.getElementById("image-preview").src = attachedImageBase64;
                    document.getElementById("preview-container").classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
        });

        // Clear Image Attachment
        document.getElementById("remove-img-btn").addEventListener("click", function() {
            attachedImageBase64 = null;
            document.getElementById("image-input").value = "";
            document.getElementById("preview-container").classList.add("hidden");
        });

        // Send Message Handler
        async function sendMessage() {
            if (!apiEndpoint) {
                alert("Backend endpoint is not connected! Please run your Kaggle Cell 2.");
                return;
            }

            const inputEl = document.getElementById("user-input");
            const text = inputEl.value.trim();
            if (!text && !attachedImageBase64) return;

            inputEl.value = "";
            inputEl.style.height = "auto";

            const chat = getActiveChat();

            // Auto-update chat title from first prompt
            if (chat.messages.length === 0 && text) {
                chat.title = text.length > 28 ? text.substring(0, 28) + "..." : text;
                renderSidebar();
            }

            // Push to local chat messages array
            const userMsg = { role: "user", content: text || "[Image Attached]", imageUrl: attachedImageBase64 };
            chat.messages.push(userMsg);
            saveChats();

            renderActiveChat();

            const currentImg = attachedImageBase64;
            attachedImageBase64 = null;
            document.getElementById("image-input").value = "";
            document.getElementById("preview-container").classList.add("hidden");

            // Format API message payload (OpenAI multimodal format)
            let apiMessages = chat.messages.map(m => {
                let contentVal = m.content;
                if (m.imageUrl) {
                    contentVal = [
                        { type: "image_url", image_url: { url: m.imageUrl } },
                        { type: "text", text: m.content }
                    ];
                }
                return { role: m.role, content: contentVal };
            });

            const assistantTextSpan = appendMessageNode("assistant", "Thinking...");

            try {
                const response = await fetch(`${apiEndpoint}/v1/chat/completions`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: targetModelName,
                        messages: apiMessages,
                        stream: true,
                        temperature: 0.0,
                        max_tokens: 4096
                    })
                });

                if (!response.ok) throw new Error("Server HTTP error " + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullResponse = "";
                assistantTextSpan.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            try {
                                const json = JSON.parse(dataStr);
                                const token = json.choices[0].delta.content || "";
                                fullResponse += token;
                                assistantTextSpan.innerHTML = marked.parse(fullResponse);
                                document.getElementById("chat-container").scrollTop = document.getElementById("chat-container").scrollHeight;
                            } catch (e) {}
                        }
                    }
                }

                // Push assistant response to chat history
                chat.messages.push({ role: "assistant", content: fullResponse, imageUrl: null });
                saveChats();

            } catch (err) {
                assistantTextSpan.innerText = "Error: " + err.message;
            }
        }

        // Attach Event Listeners
        document.getElementById("send-btn").addEventListener("click", sendMessage);

        const textarea = document.getElementById("user-input");
        
        textarea.addEventListener("keydown", function(e) {
            const isEnter = (e.key === "Enter" || e.keyCode === 13);
            if (isEnter && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                sendMessage();
                return false;
            }
        });

        textarea.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        // Initialize application on load
        initChats();
        fetchEndpoint();
    </script>
</body>
</html>
