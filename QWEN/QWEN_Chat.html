<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen TPU Chat UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-[#0f172a] text-[#f8fafc] h-screen flex flex-col font-sans">

    <!-- Top Header -->
    <header class="bg-[#1e293b] border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wide">Qwen 2.5-VL Chat</span>
            <span class="bg-blue-600 text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider">TPU v5e-8</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <div class="hidden sm:flex items-center space-x-4 text-xs text-slate-400">
                <span>Context: <strong class="text-slate-200">65,536 tokens</strong></span>
                <span>Temp: <strong class="text-slate-200">0.0 (Deterministic)</strong></span>
            </div>
            <div id="status-indicator" class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse" id="status-dot"></span>
                <span id="status-text" class="text-slate-400">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white flex-shrink-0">AI</div>
            <div class="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 max-w-2xl shadow-sm">
                <p>Hello! I am Qwen running on your Kaggle TPU node (Temperature = 0.0, Context = 64K). Attach an image or type a prompt below to start.</p>
            </div>
        </div>
    </main>

    <!-- Image Attachment Preview Box -->
    <div id="preview-container" class="max-w-4xl w-full mx-auto px-6 hidden">
        <div class="relative inline-block mb-2">
            <img id="image-preview" class="h-20 w-20 object-cover rounded-lg border border-slate-600 shadow" src="" alt="Preview">
            <button id="remove-img-btn" type="button" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow hover:bg-red-700 transition">&times;</button>
        </div>
    </div>

    <!-- User Input Controls Footer -->
    <footer class="bg-[#1e293b] border-t border-slate-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-end space-x-3">
            <!-- File Upload Button -->
            <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 p-3 rounded-xl transition flex items-center justify-center shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <input type="file" id="image-input" accept="image/*" class="hidden">
            </label>

            <!-- Text Input Area -->
            <textarea id="user-input" rows="1" placeholder="Type your prompt here... (Press Enter to send, Shift+Enter for new line)" class="flex-1 bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none max-h-32"></textarea>

            <!-- Send Button -->
            <button id="send-btn" type="button" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition flex items-center justify-center shadow">
                Send
            </button>
        </div>
    </footer>

    <!-- Frontend Script Logic -->
    <script>
        let apiEndpoint = "";
        let targetModelName = "Qwen/Qwen2.5-VL-7B-Instruct";
        let chatHistory = [];
        let attachedImageBase64 = null;

        // Fetch endpoint URL from QWEN_ENDPOINT.json
        async function fetchEndpoint() {
            try {
                const res = await fetch('./QWEN_ENDPOINT.json?t=' + Date.now());
                const data = await res.json();
                if (data && data.url) {
                    apiEndpoint = data.url.replace(/\/$/, "");
                    
                    // Fetch model name dynamically from backend
                    try {
                        const modelRes = await fetch(`${apiEndpoint}/v1/models`);
                        const modelData = await modelRes.json();
                        if (modelData.data && modelData.data[0]) {
                            targetModelName = modelData.data[0].id;
                        }
                    } catch(e) {}

                    document.getElementById("status-dot").className = "w-3 h-3 rounded-full bg-green-500";
                    document.getElementById("status-text").innerText = "Connected";
                    document.getElementById("status-text").className = "text-green-400 font-medium";
                }
            } catch (err) {
                document.getElementById("status-dot").className = "w-3 h-3 rounded-full bg-red-500";
                document.getElementById("status-text").innerText = "Offline (Kaggle cell stopped)";
                setTimeout(fetchEndpoint, 4000);
            }
        }

        // Handle Image Attachment Selection
        document.getElementById("image-input").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedImageBase64 = e.target.result;
                    document.getElementById("image-preview").src = attachedImageBase64;
                    document.getElementById("preview-container").classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
        });

        // Clear Image Attachment
        document.getElementById("remove-img-btn").addEventListener("click", function() {
            attachedImageBase64 = null;
            document.getElementById("image-input").value = "";
            document.getElementById("preview-container").classList.add("hidden");
        });

        // Render Message Bubbles
        function appendMessage(role, content, imageUrl = null) {
            const chatContainer = document.getElementById("chat-container");
            const isUser = role === "user";
            
            const messageDiv = document.createElement("div");
            messageDiv.className = `flex items-start space-x-4 ${isUser ? "flex-row-reverse space-x-reverse" : ""}`;

            const avatar = document.createElement("div");
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 ${isUser ? "bg-emerald-600" : "bg-blue-600"}`;
            avatar.innerText = isUser ? "U" : "AI";

            const bubble = document.createElement("div");
            bubble.className = `p-4 rounded-2xl border max-w-2xl shadow-sm ${isUser ? "bg-blue-600 border-blue-500 text-white" : "bg-[#1e293b] border-slate-700 text-slate-100"}`;

            if (imageUrl) {
                const img = document.createElement("img");
                img.src = imageUrl;
                img.className = "max-h-48 rounded-lg mb-3 object-contain border border-slate-600";
                bubble.appendChild(img);
            }

            const textSpan = document.createElement("div");
            if (isUser) {
                textSpan.innerText = content;
            } else {
                textSpan.innerHTML = marked.parse(content);
            }
            bubble.appendChild(textSpan);

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return textSpan;
        }

        // Send Message Handler
        async function sendMessage() {
            if (!apiEndpoint) {
                alert("Backend endpoint is not connected! Please run your Kaggle Cell 2.");
                return;
            }

            const inputEl = document.getElementById("user-input");
            const text = inputEl.value.trim();
            if (!text && !attachedImageBase64) return;

            inputEl.value = "";
            inputEl.style.height = "auto";

            // Format message payload according to vLLM multimodal spec
            let userContent = [];
            if (attachedImageBase64) {
                userContent.push({ type: "image_url", image_url: { url: attachedImageBase64 } });
            }
            if (text) {
                userContent.push({ type: "text", text: text });
            }

            appendMessage("user", text || "[Image Attached]", attachedImageBase64);
            chatHistory.push({ role: "user", content: userContent });

            attachedImageBase64 = null;
            document.getElementById("image-input").value = "";
            document.getElementById("preview-container").classList.add("hidden");

            const assistantTextSpan = appendMessage("assistant", "Thinking...");

            try {
                const response = await fetch(`${apiEndpoint}/v1/chat/completions`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: targetModelName,
                        messages: chatHistory,
                        stream: true,
                        temperature: 0.0,
                        max_tokens: 4096
                    })
                });

                if (!response.ok) throw new Error("Server HTTP error " + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullResponse = "";
                assistantTextSpan.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            try {
                                const json = JSON.parse(dataStr);
                                const token = json.choices[0].delta.content || "";
                                fullResponse += token;
                                assistantTextSpan.innerHTML = marked.parse(fullResponse);
                                document.getElementById("chat-container").scrollTop = document.getElementById("chat-container").scrollHeight;
                            } catch (e) {}
                        }
                    }
                }

                chatHistory.push({ role: "assistant", content: fullResponse });

            } catch (err) {
                assistantTextSpan.innerText = "Error: " + err.message;
            }
        }

        // Attach Event Listeners
        document.getElementById("send-btn").addEventListener("click", sendMessage);

        const textarea = document.getElementById("user-input");
        
        // Handle Enter (Send) vs Shift+Enter (Newline)
        textarea.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-expand textarea on input
        textarea.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        // Initial endpoint check
        fetchEndpoint();
    </script>
</body>
</html>
