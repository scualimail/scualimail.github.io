<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Qwen Endpoint...</title>
  <script>
    async function redirectToEndpoint() {
      try {
        // Fetch the active endpoint generated by Kaggle
        const response = await fetch('./QWEN_ENDPOINT.json?t=' + Date.now());
        const data = await response.json();
        if (data && data.url) {
          // Redirect browser directly to the Cloudflare URL
          window.location.href = data.url;
        } else {
          document.body.innerText = "Endpoint URL not found or Kaggle session is offline.";
        }
      } catch (err) {
        document.body.innerText = "Error loading endpoint JSON: " + err;
      }
    }
    window.onload = redirectToEndpoint;
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #0f172a; color: #f8fafc;">
  <h2>Connecting to Kaggle TPU endpoint...</h2>
  <p>Please wait while we forward you to the live stream.</p>
</body>
</html>
